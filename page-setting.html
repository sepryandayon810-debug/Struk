<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Setruk - Setting</title>
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="page-setting">

  <header class="app-header">
    <button id="btn-kembali-kasir" class="btn-icon">←</button>
    <h1>⚙️ Pengaturan</h1>
  </header>

  <main class="setting-container">

    <!-- HEADER STRUK -->
    <section class="setting-group">
      <h3>Header Struk</h3>
      <label>Nama Toko</label>
      <input type="text" id="inp-nama-toko" placeholder="Nama Toko Anda">

      <label>Alamat</label>
      <input type="text" id="inp-alamat" placeholder="Jl. Mawar No. 1">

      <label>Telepon / WA</label>
      <input type="text" id="inp-telepon" placeholder="0812xxxx">

      <label>Footer Struk</label>
      <input type="text" id="inp-footer" placeholder="Terima Kasih">
    </section>

    <!-- PRINTER -->
    <section class="setting-group">
      <h3>Printer Bluetooth</h3>
      <label>MAC Address Printer</label>
      <input type="text" id="inp-printer-mac" placeholder="00:11:22:33:44:55">
      <button id="btn-scan-printer" class="btn-secondary btn-full">🔍 Scan Printer</button>

      <div class="toggle-row">
        <label>Auto Print setelah Bayar</label>
        <input type="checkbox" id="inp-auto-print">
      </div>
    </section>

    <!-- AKSI -->
    <section class="setting-group aksi">
      <button id="btn-test-print" class="btn-secondary btn-full">🖨 Test Print</button>
      <button id="btn-simpan-setting" class="btn-primary btn-full">💾 Simpan Pengaturan</button>
    </section>

  </main>

  <script src="js/app.js"></script>
  <script src="js/setting.js"></script>
</body>
</html>
