<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Setruk POS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: linear-gradient(135deg, #2d3436 0%, #000000 100%);
      color: #fff;
      text-align: center;
      padding: 20px;
    }
    .logo {
      width: 100px; height: 100px;
      background: #00b894;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(0,184,148,0.3);
    }
    h1 { font-size: 1.6rem; margin-bottom: 4px; }
    p.sub { font-size: 0.85rem; color: #b2bec3; margin-bottom: 40px; }
    .menu {
      width: 100%;
      max-width: 320px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 20px;
      border-radius: 14px;
      border: none;
      font-size: 1.1rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      color: inherit;
    }
    .btn-kasir {
      background: #00b894;
      color: #fff;
      box-shadow: 0 4px 16px rgba(0,184,148,0.3);
    }
    .btn-kasir:active { transform: scale(0.97); }
    .btn-setting {
      background: #2d3436;
      color: #dfe6e9;
      border: 1.5px solid #636e72;
    }
    .btn-setting:active { transform: scale(0.97); background: #353b48; }
    .icon { font-size: 1.6rem; }
    .info-box {
      margin-top: 30px;
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border-radius: 10px;
      font-size: 0.75rem;
      color: #b2bec3;
      max-width: 320px;
      width: 100%;
    }
    .info-box strong { color: #fff; display: block; margin-bottom: 4px; font-size: 0.8rem; }
    .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
    .dot.on { background: #00b894; }
    .dot.off { background: #ff7675; }
    .notice {
      background: rgba(0,184,148,0.15);
      border: 1px solid rgba(0,184,148,0.3);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
      font-size: 0.85rem;
      color: #dfe6e9;
      max-width: 320px;
      width: 100%;
      display: none;
    }
  </style>
</head>
<body>

  <div class="logo">🧾</div>
  <h1>Setruk</h1>
  <p class="sub">Point of Sale Android</p>

  <div id="first-run" class="notice">
    ⚠️ <strong>Setup Pertama!</strong><br>
    Silakan atur header struk & printer di menu Setting sebelum mulai jualan.
  </div>

  <div class="menu">
    <a href="page-kasir.html" class="btn btn-kasir">
      <span class="icon">🛒</span>
      <span>Menu Kasir</span>
    </a>
    <a href="page-setting.html" class="btn btn-setting">
      <span class="icon">⚙️</span>
      <span>Pengaturan</span>
    </a>
  </div>

  <div class="info-box">
    <strong>📍 Info Toko</strong>
    <div id="info-nama">Belum diatur</div>
    <div style="margin-top:6px;">
      <span id="dot-printer" class="dot off"></span>
      <span id="txt-printer">Printer belum terhubung</span>
    </div>
  </div>

  <script>
    // ─── UTILITY ───
    const fmt = (n) => 'Rp ' + parseInt(n||0).toLocaleString('id-ID');
    const getS = () => {
      try {
        return JSON.parse(localStorage.getItem('kasirin_setting')) || {
          namaToko:'KasiRin POS', alamat:'', telepon:'', footer:'Terima Kasih', printerMAC:'', autoPrint:false
        };
      } catch(e) { return {namaToko:'KasiRin POS', alamat:'', telepon:'', footer:'Terima Kasih', printerMAC:'', autoPrint:false}; }
    };

    // ─── TAMPILKAN INFO ───
    const s = getS();
    document.getElementById('info-nama').textContent = s.namaToko || 'Belum diatur';
    if (s.printerMAC) {
      document.getElementById('dot-printer').className = 'dot on';
      document.getElementById('txt-printer').textContent = 'Printer: ' + s.printerMAC;
    }

    // ─── FIRST RUN ───
    if (!s.namaToko || s.namaToko === 'KasiRin POS' || !s.printerMAC) {
      document.getElementById('first-run').style.display = 'block';
    }
  </script>

</body>
</html>
